name: Demo page

# Publishes the HTML backtest report to GitHub Pages so it can be viewed
# without cloning. Synthetic data only: no network, no keys, deterministic.
#
# Off until the repository variable PAGES_ENABLED is "true" and Pages is set
# to deploy from GitHub Actions (Settings -> Pages). Until then both jobs are
# skipped, so this never turns CI red.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Render the report
        env:
          PYTHONPATH: src
        run: |
          mkdir -p site
          python -m tradebot dashboard --out site/index.html \
            --title "tradebot · portfolio backtest demo" \
            --banner "Synthetic random-walk data, regenerated on every push. This shows the tooling, not trading performance. Not financial advice."
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
